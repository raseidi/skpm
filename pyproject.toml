[project]
name = "skpm"
# The version comes from the git tag; see [tool.pdm.version] below.
dynamic = ["version"]
description = "Process mining, the scikit-learn way."
authors = [{ name = "Rafael Oyamada" }]
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E*"]
# No "License :: ..." entry: `license = "MIT"` above already emits the
# License-Expression metadata field, and PyPI rejects a package that sets both.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "scikit-learn>=1.6.1",
    "pandas>=2.2.0",
    "pyarrow>=16.0.0",
    "polars>=0.20.16",
    "lxml==5.1.0",
]

[dependency-groups]
# Minimal set needed to run the suite; CI installs only this group.
test = [
    "pytest>=7.4.4",
    "pytest-cov>=4.1.0",
    "coverage>=7.4.1",
    # tests/test_examples.py executes the gallery examples, which plot.
    "matplotlib>=3.8",
]
dev = [
    { include-group = "test" },
    "black>=24.1.1",
    "mypy>=1.8.0",
]
docs = [
    "matplotlib>=3.8",
    "sphinx>=8.1,<9",
    "sphinx-autoapi>=3.8",
    "sphinx-autobuild>=2024.10",
    "sphinx-design>=0.6",
    "sphinx-gallery>=0.17",
    "sphinx-rtd-theme>=3.0",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

# Read the version from the git tag, so `git tag v0.1.0` is the only place a
# release number is written
[tool.pdm.version]
source = "scm"

[tool.black]
line-length = 80

[project.urls]
Homepage = "https://github.com/raseidi/skpm"
Docs = "https://skpm.readthedocs.io/"