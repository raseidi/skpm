[project]
name = "skpm"
version = "0.0.1"
description = "A process mining library built upon scikit-learn!"
authors = [{ name = "Rafael Oyamada" }]
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "scikit-learn>=1.6.1",
    "pandas>=2.2.0",
    "pyarrow>=16.0.0",
    "polars>=0.20.16",
    "lxml==5.1.0",
]

[dependency-groups]
# Minimal set needed to run the suite; CI installs only this group.
test = [
    "pytest>=7.4.4",
    "pytest-cov>=4.1.0",
    "coverage>=7.4.1",
    # tests/test_examples.py executes the gallery examples, which plot.
    "matplotlib>=3.8",
]
dev = [
    { include-group = "test" },
    "black>=24.1.1",
    "mypy>=1.8.0",
]
docs = [
    "matplotlib>=3.8",
    "sphinx>=8.1,<9",
    "sphinx-autoapi>=3.8",
    "sphinx-autobuild>=2024.10",
    "sphinx-design>=0.6",
    "sphinx-gallery>=0.17",
    "sphinx-rtd-theme>=3.0",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.black]
line-length = 80
