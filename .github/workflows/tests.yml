name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv and set up Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install project and test dependencies
        # --locked fails the job if uv.lock is stale w.r.t. pyproject.toml, so
        # CI can never resolve a different environment than the lockfile pins.
        run: uv sync --locked --no-default-groups --group test

      - name: Run tests
        run: uv run pytest tests --cov=skpm --cov-report=term --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          name: py${{ matrix.python }}-${{ matrix.os }}
          fail_ci_if_error: false
