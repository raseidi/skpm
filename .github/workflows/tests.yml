name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets you re-run the suite from the Actions tab without pushing a commit.
  workflow_dispatch:

# Least privilege: the suite only ever needs to read the repository. Anything
# that writes (releases, comments, OIDC) must opt in explicitly, per job.
permissions:
  contents: read

# One run per branch. A new push supersedes an in-flight run on a pull request,
# but runs on main are left alone so every commit there keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # The suite takes ~15s; this is a runaway guard, not a target. Without it a
    # hung download would hold the runner for GitHub's 6-hour default.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Minor-version selectors: always the latest patch release, which is
        # what users actually run. Quoted so YAML keeps '3.10' from becoming 3.1.
        python: ['3.11', '3.12']
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv and set up Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install project and test dependencies
        # --locked fails the job if uv.lock is stale w.r.t. pyproject.toml, so
        # CI can never resolve a different environment than the lockfile pins.
        run: uv sync --locked --no-default-groups --group test

      - name: Run tests
        run: uv run pytest tests --cov=skpm --cov-report=term --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          name: py${{ matrix.python }}-${{ matrix.os }}
          fail_ci_if_error: false
